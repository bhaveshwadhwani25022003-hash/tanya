<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x160f28, 0.03);

const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.8, 8.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting setup for glowing romantic cake
const ambientLight = new THREE.AmbientLight(0xffe8ed, 1.6);
scene.add(ambientLight);

const mainSpot = new THREE.SpotLight(0xfff3b0, 4.0, 30, Math.PI / 4, 0.4);
mainSpot.position.set(0, 9, 6);
scene.add(mainSpot);

const pinkRimLight = new THREE.PointLight(0xff758f, 3.8, 25);
pinkRimLight.position.set(4, 3, 3);
scene.add(pinkRimLight);

const goldFillLight = new THREE.PointLight(0xffd166, 3.2, 25);
goldFillLight.position.set(-4, 1, 2);
scene.add(goldFillLight);

// Master Cake & Decor Group
const masterGroup = new THREE.Group();
scene.add(masterGroup);

// Luxurious Ornate Pedestal / Cake Stand
const standMat = new THREE.MeshPhongMaterial({ color: 0xfdf0d5, shininess: 120, specular: 0xffffff });
const goldTrimMat = new THREE.MeshPhongMaterial({ color: 0xf3c68f, shininess: 140, specular: 0xffe89e });

const plateBaseGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.16, 48);
const plateBase = new THREE.Mesh(plateBaseGeo, standMat);
plateBase.position.y = -1.5;
masterGroup.add(plateBase);

const plateStandGeo = new THREE.CylinderGeometry(0.7, 1.1, 0.6, 32);
const plateStand = new THREE.Mesh(plateStandGeo, goldTrimMat);
plateStand.position.y = -1.85;
masterGroup.add(plateStand);

const plateFootGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.2, 32);
const plateFoot = new THREE.Mesh(plateFootGeo, standMat);
plateFoot.position.y = -2.2;
masterGroup.add(plateFoot);

// Tier 1 (Base - Rich Velvet / Cream with frosting piping)
const tier1Geo = new THREE.CylinderGeometry(2.1, 2.1, 0.85, 48);
const tier1Mat = new THREE.MeshPhongMaterial({ color: 0xffe3ea, shininess: 70, specular: 0xffffff });
const tier1 = new THREE.Mesh(tier1Geo, tier1Mat);
tier1.position.y = -1.0;
masterGroup.add(tier1);

// Piping around Tier 1 base
const trim1 = new THREE.Mesh(new THREE.TorusGeometry(2.12, 0.1, 16, 48), goldTrimMat);
trim1.rotation.x = Math.PI / 2;
trim1.position.y = -1.4;
masterGroup.add(trim1);

// Tier 2 (Middle - Rose Quartz Pink)
const tier2Geo = new THREE.CylinderGeometry(1.55, 1.55, 0.8, 48);
const tier2Mat = new THREE.MeshPhongMaterial({ color: 0xff85a1, shininess: 85, specular: 0xffd9e8 });
const tier2 = new THREE.Mesh(tier2Geo, tier2Mat);
tier2.position.y = -0.2;
masterGroup.add(tier2);

const trim2 = new THREE.Mesh(new THREE.TorusGeometry(1.56, 0.09, 16, 48), goldTrimMat);
trim2.rotation.x = Math.PI / 2;
trim2.position.y = -0.6;
masterGroup.add(trim2);

// Tier 3 (Top Tier - Champagne Cream with drip glaze texture)
const tier3Geo = new THREE.CylinderGeometry(1.05, 1.05, 0.75, 48);
const tier3Mat = new THREE.MeshPhongMaterial({ color: 0xffcad4, shininess: 95, specular: 0xffffff });
const tier3 = new THREE.Mesh(tier3Geo, tier3Mat);
tier3.position.y = 0.55;
masterGroup.add(tier3);

const trim3 = new THREE.Mesh(new THREE.TorusGeometry(1.06, 0.08, 16, 48), goldTrimMat);
trim3.rotation.x = Math.PI / 2;
trim3.position.y = 0.2;
masterGroup.add(trim3);

// Frosting Rosettes & Strawberries on Tier edges
const strawberryGeo = new THREE.ConeGeometry(0.12, 0.22, 16);
const strawberryMat = new THREE.MeshPhongMaterial({ color: 0xd90429, shininess: 130, specular: 0xff85a1 });

for (let i = 0; i < 14; i++) {
  const angle = (i / 14) * Math.PI * 2;
  const berry = new THREE.Mesh(strawberryGeo, strawberryMat);
  berry.rotation.x = Math.PI;
  berry.position.set(Math.cos(angle) * 1.85, -0.52, Math.sin(angle) * 1.85);
  masterGroup.add(berry);
}

for (let i = 0; i < 9; i++) {
  const angle = (i / 9) * Math.PI * 2 + 0.2;
  const berry = new THREE.Mesh(strawberryGeo, strawberryMat);
  berry.rotation.x = Math.PI;
  berry.position.set(Math.cos(angle) * 1.35, 0.22, Math.sin(angle) * 1.35);
  masterGroup.add(berry);
}

// "29" Golden Cake Topper & Romantic Heart
const topperGroup = new THREE.Group();
topperGroup.position.set(0, 1.25, 0);

// Ring Heart Topper
const heartRingGeo = new THREE.TorusGeometry(0.42, 0.06, 16, 32);
const topperMat = new THREE.MeshPhongMaterial({ color: 0xffd166, shininess: 160, specular: 0xffffff });
const heartRing = new THREE.Mesh(heartRingGeo, topperMat);
topperGroup.add(heartRing);

// 7 Delicate Candles with animated flame flickers
const candleGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.45, 16);
const candleMat = new THREE.MeshPhongMaterial({ color: 0xfff0f5, shininess: 80 });
const flameGeo = new THREE.ConeGeometry(0.07, 0.22, 16);
const flameMat = new THREE.MeshBasicMaterial({ color: 0xff9e00 });
const innerFlameGeo = new THREE.ConeGeometry(0.04, 0.14, 16);
const innerFlameMat = new THREE.MeshBasicMaterial({ color: 0xfffa65 });

const candlePositions = [
  [-0.65, 0.95, -0.3],
  [0.65, 0.95, -0.3],
  [0.0, 0.95, 0.65],
  [-0.55, 0.95, 0.35],
  [0.55, 0.95, 0.35],
  [-0.25, 0.95, -0.55],
  [0.25, 0.95, -0.55]
];

const candleFlames = [];
candlePositions.forEach((pos) => {
  const candle = new THREE.Mesh(candleGeo, candleMat);
  candle.position.set(pos[0], pos[1], pos[2]);
  masterGroup.add(candle);

  const flameContainer = new THREE.Group();
  flameContainer.position.set(pos[0], pos[1] + 0.3, pos[2]);
  
  const outerFlame = new THREE.Mesh(flameGeo, flameMat);
  flameContainer.add(outerFlame);
  
  const innerFlame = new THREE.Mesh(innerFlameGeo, innerFlameMat);
  innerFlame.position.y = 0.02;
  flameContainer.add(innerFlame);

  masterGroup.add(flameContainer);
  candleFlames.push(flameContainer);
});

masterGroup.add(topperGroup);

// Sparkling Fireworks / Starlight Particle Ribbon
const particleCount = 280;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);

const palette = [
  new THREE.Color(0xff758f),
  new THREE.Color(0xffd166),
  new THREE.Color(0xffcad4),
  new THREE.Color(0xffffff),
  new THREE.Color(0x9d4edd)
];

for (let i = 0; i < particleCount; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 14;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 9;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 11;

  const col = palette[Math.floor(Math.random() * palette.length)];
  pColors[i * 3] = col.r;
  pColors[i * 3 + 1] = col.g;
  pColors[i * 3 + 2] = col.b;
}

pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.16,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const sparklers = new THREE.Points(pGeo, pMat);
scene.add(sparklers);

// Floating celebration balloons around the cake
const balloonColors = [0xff758f, 0xffd166, 0xff85a1, 0x9d4edd, 0xfbb1bd, 0x48cae4];
const balloons = [];
const balloonGeo = new THREE.SphereGeometry(0.65, 32, 24);
balloonGeo.scale(1, 1.3, 1);

for (let i = 0; i < 14; i++) {
  const bMat = new THREE.MeshPhongMaterial({
    color: balloonColors[i % balloonColors.length],
    shininess: 110,
    specular: 0xffffff,
    transparent: true,
    opacity: 0.92
  });
  const balloon = new THREE.Mesh(balloonGeo, bMat);
  const angle = (i / 14) * Math.PI * 2 + (Math.random() * 0.3);
  const radius = 3.6 + Math.random() * 2.5;
  const y = -1.2 + Math.random() * 5.2;

  balloon.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  balloon.userData = {
    floatSpeed: 0.007 + Math.random() * 0.01,
    floatOffset: Math.random() * 12,
    drift: 0.006 + Math.random() * 0.006
  };
  scene.add(balloon);
  balloons.push(balloon);
}

// Mouse tracking & interactivity
let mouseX = 0;
let mouseY = 0;
let spinVelocity = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('click', () => {
  spinVelocity = 0.35; // Celebratory fast spin on click
});

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Render Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth rotation following cursor + auto-turn + spin burst
  const targetRotY = mouseX * 0.5;
  const targetRotX = mouseY * 0.22;
  
  masterGroup.rotation.y += (targetRotY - masterGroup.rotation.y) * 0.05 + 0.009 + spinVelocity;
  masterGroup.rotation.x += (targetRotX - masterGroup.rotation.x) * 0.05;
  masterGroup.position.y = Math.sin(time * 1.6) * 0.14;

  if (spinVelocity > 0) {
    spinVelocity *= 0.94;
    if (spinVelocity < 0.001) spinVelocity = 0;
  }

  // Topper gentle pulse
  topperGroup.rotation.y = Math.sin(time * 2.0) * 0.25;

  // Candle flame animation
  candleFlames.forEach((flame, idx) => {
    const s = 1.0 + Math.sin(time * 14 + idx * 2.2) * 0.22;
    flame.scale.set(s, s * 1.15, s);
  });

  // Balloon floating
  balloons.forEach((b) => {
    b.position.y += Math.sin(time * 2.0 + b.userData.floatOffset) * 0.005;
    b.rotation.y += b.userData.drift;
    b.rotation.z = Math.sin(time * 1.4 + b.userData.floatOffset) * 0.06;
  });

  // Sparkler swirl
  sparklers.rotation.y = time * 0.06;
  sparklers.rotation.x = Math.sin(time * 0.05) * 0.18;

  renderer.render(scene, camera);
}

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
