<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D Birthday Celebration Scene
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x160f28, 0.035);

const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.5, 7.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffe4e6, 1.4);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xff758f, 3.5, 20);
pointLight1.position.set(3, 4, 3);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xffd166, 3.0, 20);
pointLight2.position.set(-3, -2, 2);
scene.add(pointLight2);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(0, 6, 4);
scene.add(dirLight);

// Group for the 3D Birthday Cake & Gift
const mainGroup = new THREE.Group();
scene.add(mainGroup);

// Tiered Birthday Cake
// Cake Base Tier
const cakeBaseGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.7, 32);
const cakeBaseMat = new THREE.MeshPhongMaterial({ color: 0xffe3ea, shininess: 80, specular: 0xffffff });
const cakeBase = new THREE.Mesh(cakeBaseGeo, cakeBaseMat);
cakeBase.position.y = -0.65;
mainGroup.add(cakeBase);

// Frosting trim bottom
const trimGeo = new THREE.TorusGeometry(1.6, 0.08, 16, 48);
const goldMat = new THREE.MeshPhongMaterial({ color: 0xf3c68f, shininess: 100, specular: 0xfff3b0 });
const trim1 = new THREE.Mesh(trimGeo, goldMat);
trim1.rotation.x = Math.PI / 2;
trim1.position.y = -1.0;
mainGroup.add(trim1);

// Cake Top Tier
const cakeTopGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.65, 32);
const cakeTopMat = new THREE.MeshPhongMaterial({ color: 0xff85a1, shininess: 90, specular: 0xffffff });
const cakeTop = new THREE.Mesh(cakeTopGeo, cakeTopMat);
cakeTop.position.y = 0.02;
mainGroup.add(cakeTop);

// Frosting trim mid
const trim2 = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.07, 16, 48), goldMat);
trim2.rotation.x = Math.PI / 2;
trim2.position.y = -0.3;
mainGroup.add(trim2);

// Candles on top
const candleGroup = new THREE.Group();
const candleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.35, 16);
const candleMat = new THREE.MeshPhongMaterial({ color: 0xfff0f5, shininess: 50 });
const flameGeo = new THREE.ConeGeometry(0.06, 0.16, 16);
const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

const candlePositions = [
  [-0.4, 0.5, -0.2],
  [0.4, 0.5, -0.2],
  [0.0, 0.5, 0.35],
  [-0.3, 0.5, 0.2],
  [0.3, 0.5, 0.2]
];

const flames = [];
candlePositions.forEach((pos) => {
  const c = new THREE.Mesh(candleGeo, candleMat);
  c.position.set(pos[0], pos[1], pos[2]);
  candleGroup.add(c);
  
  const f = new THREE.Mesh(flameGeo, flameMat);
  f.position.set(pos[0], pos[1] + 0.24, pos[2]);
  candleGroup.add(f);
  flames.push(f);
});
mainGroup.add(candleGroup);

// Decorative Sugar Pearls / Strawberries
const berryGeo = new THREE.SphereGeometry(0.08, 16, 16);
const berryMat = new THREE.MeshPhongMaterial({ color: 0xff0a54, shininess: 120 });
for (let i = 0; i < 10; i++) {
  const angle = (i / 10) * Math.PI * 2;
  const berry = new THREE.Mesh(berryGeo, berryMat);
  berry.position.set(Math.cos(angle) * 0.9, 0.38, Math.sin(angle) * 0.9);
  mainGroup.add(berry);
}

// Floating Festive Balloons
const balloonGroup = new THREE.Group();
scene.add(balloonGroup);

const balloonGeo = new THREE.SphereGeometry(0.55, 32, 24);
balloonGeo.scale(1, 1.25, 1);

const balloonColors = [0xff70a6, 0xff9770, 0xffd670, 0xe9ff70, 0x70d6ff, 0xffb5a7];
const balloons = [];

for (let i = 0; i < 12; i++) {
  const col = balloonColors[i % balloonColors.length];
  const bMat = new THREE.MeshPhongMaterial({
    color: col,
    shininess: 90,
    specular: 0xffffff,
    transparent: true,
    opacity: 0.88
  });
  const balloon = new THREE.Mesh(balloonGeo, bMat);
  
  const rad = 2.8 + Math.random() * 2.2;
  const theta = (i / 12) * Math.PI * 2 + (Math.random() * 0.4);
  const yPos = -1.5 + Math.random() * 4.5;
  
  balloon.position.set(Math.cos(theta) * rad, yPos, Math.sin(theta) * rad);
  balloon.userData = {
    speedY: 0.008 + Math.random() * 0.012,
    baseY: yPos,
    angle: theta,
    driftSpeed: 0.005 + Math.random() * 0.005,
    floatOffset: Math.random() * 10
  };
  balloonGroup.add(balloon);
  balloons.push(balloon);
}

// Sparkling Hearts & Stars Particle Swarm
const particleCount = 200;
const pGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);

const pColorOptions = [
  new THREE.Color(0xff85a1),
  new THREE.Color(0xffd166),
  new THREE.Color(0xffffff),
  new THREE.Color(0xfbb1bd)
];

for (let i = 0; i < particleCount; i++) {
  pPositions[i * 3] = (Math.random() - 0.5) * 12;
  pPositions[i * 3 + 1] = (Math.random() - 0.5) * 8;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  
  const chosenCol = pColorOptions[Math.floor(Math.random() * pColorOptions.length)];
  pColors[i * 3] = chosenCol.r;
  pColors[i * 3 + 1] = chosenCol.g;
  pColors[i * 3 + 2] = chosenCol.b;
}

pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.12,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Mouse interaction tracking
let mouseX = 0;
let mouseY = 0;
let targetRotX = 0;
let targetRotY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Click / Hover interaction with cake (celebratory pop)
let isSpinningFast = false;
let spinBoost = 0;
window.addEventListener('click', () => {
  spinBoost = 0.25;
});

// Resize handler
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  
  // Smooth mouse follow
  targetRotY = mouseX * 0.45;
  targetRotX = mouseY * 0.2;
  mainGroup.rotation.y += (targetRotY - mainGroup.rotation.y) * 0.05 + 0.008 + spinBoost;
  mainGroup.rotation.x += (targetRotX - mainGroup.rotation.x) * 0.05;
  mainGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.12;
  
  if (spinBoost > 0) {
    spinBoost *= 0.94;
    if (spinBoost < 0.001) spinBoost = 0;
  }
  
  // Flicker candle flames
  flames.forEach((flame, idx) => {
    const s = 1 + Math.sin(elapsedTime * 12 + idx) * 0.18;
    flame.scale.set(s, s * 1.1, s);
  });
  
  // Animate floating balloons
  balloons.forEach((b) => {
    b.position.y += Math.sin(elapsedTime * 1.8 + b.userData.floatOffset) * 0.004;
    b.rotation.y += b.userData.driftSpeed;
    b.rotation.z = Math.sin(elapsedTime * 1.2 + b.userData.floatOffset) * 0.08;
  });
  
  // Particle sparkle swirl
  particles.rotation.y = elapsedTime * 0.05;
  particles.rotation.x = Math.sin(elapsedTime * 0.04) * 0.2;
  
  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
